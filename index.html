<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Davao City Jeepney Route Finder</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 100%; width: 100%; z-index: 1; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden font-sans">

  <div class="flex flex-col md:flex-row h-full w-full">

    <!-- Sidebar / Panel -->
    <div class="w-full md:w-96 bg-slate-800 flex flex-col z-10 shadow-xl border-r border-slate-700 h-2/5 md:h-full">

      <!-- Header -->
      <div class="p-4 bg-slate-900 border-b border-slate-700 flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
            <span>🚌</span> Davao Jeep Routes
          </h1>
          <p class="text-xs text-slate-400">Interactive PUJ Commute & Route Simulator</p>
        </div>
        <button id="locate-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
          📍 My Location
        </button>
      </div>

      <!-- Chat / Search Interface -->
      <div class="p-4 bg-slate-800/80 border-b border-slate-700">
        <label class="block text-xs font-medium text-slate-300 mb-1">Where do you want to go?</label>
        <div class="flex gap-2">
          <input type="text" id="chat-input" placeholder="e.g. Abreeza, or from Matina to Abreeza"
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400">
          <button id="search-btn" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 rounded-lg text-sm transition">
            Go
          </button>
        </div>
        <!-- Quick Preset Tags -->
        <div class="flex flex-wrap gap-1.5 mt-2">
          <span class="text-[10px] text-slate-400">Try:</span>
          <button class="preset-tag text-[10px] bg-slate-700 hover:bg-amber-500 hover:text-slate-950 px-2 py-0.5 rounded text-slate-300 transition" data-query="Abreeza">Abreeza</button>
          <button class="preset-tag text-[10px] bg-slate-700 hover:bg-amber-500 hover:text-slate-950 px-2 py-0.5 rounded text-slate-300 transition" data-query="SM Lanang">SM Lanang</button>
          <button class="preset-tag text-[10px] bg-slate-700 hover:bg-amber-500 hover:text-slate-950 px-2 py-0.5 rounded text-slate-300 transition" data-query="Roxas Night Market">Roxas Market</button>
          <button class="preset-tag text-[10px] bg-slate-700 hover:bg-amber-500 hover:text-slate-950 px-2 py-0.5 rounded text-slate-300 transition" data-query="Toril">Toril</button>
        </div>
        <p class="text-[10px] text-slate-500 mt-2">Uses your GPS location. Type "from Matina to Abreeza" to set a different starting point.</p>
        <details class="mt-2">
          <summary class="text-[10px] text-slate-500 cursor-pointer select-none">Search settings</summary>
          <div class="mt-2 flex gap-1.5">
            <input id="gmaps-key" type="password" autocomplete="off" spellcheck="false"
                   placeholder="Google Places API key (optional)"
                   class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400">
            <button id="save-gmaps-key" class="bg-slate-700 hover:bg-slate-600 text-slate-100 px-2 rounded text-[10px] font-semibold">Save</button>
          </div>
          <p id="gmaps-key-status" class="text-[9px] text-slate-500 mt-1">Without a key, place lookup uses OpenStreetMap. The key is stored only in this browser.</p>
        </details>
      </div>

      <!-- Route Selector / Chat Output -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3" id="route-list">
        <!-- Dynamic content injected here -->
      </div>

      <!-- Animation Controls -->
      <div class="p-4 bg-slate-900 border-t border-slate-700 space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-300">
          <span id="active-route-name" class="font-semibold text-amber-400">Select a Route</span>
          <span id="anim-speed-label" class="text-slate-400">Speed: 1x</span>
        </div>

        <div class="flex items-center gap-2">
          <button id="play-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded text-xs font-bold transition min-w-[60px]">
            ▶ Play
          </button>
          <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full accent-amber-400 cursor-pointer">
        </div>

        <div class="flex justify-between items-center text-xs">
          <label class="flex items-center gap-1.5 text-slate-400 cursor-pointer">
            <input type="checkbox" id="follow-cam" checked class="rounded accent-amber-400"> Follow Camera
          </label>
          <div class="flex gap-1">
            <button class="speed-btn px-2 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] hover:bg-slate-700" data-speed="1">1x</button>
            <button class="speed-btn px-2 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] hover:bg-slate-700" data-speed="2">2x</button>
            <button class="speed-btn px-2 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] hover:bg-slate-700" data-speed="5">5x</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Map Container -->
    <div class="flex-1 h-3/5 md:h-full relative">
      <div id="map"></div>
    </div>

  </div>

    // --- HELPERS ---
    function normalizeText(text) {
      return text
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formatDistance(meters) {
      return meters >= 1000 ? `${(meters / 1000).toFixed(1)} km` : `${Math.round(meters)} m`;
    }

    function haversineDistance(p1, p2) {
      const R = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(p2[0] - p1[0]);
      const dLng = toRad(p2[1] - p1[1]);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(p1[0])) * Math.cos(toRad(p2[0])) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function buildCumulativeDistances(coords) {
      const cumulative = [0];
      for (let i = 1; i < coords.length; i++) {
        cumulative.push(cumulative[i - 1] + haversineDistance(coords[i - 1], coords[i]));
      }
      return cumulative;
    }

    function interpolatePath(coords, cumulative, t) {
      if (coords.length < 2) return coords[0];

      const total = cumulative[cumulative.length - 1];
      if (!total) return coords[0];

      const target = Math.min(Math.max(t, 0), 1) * total;
      let low = 0;
      let high = cumulative.length - 1;

      while (low < high - 1) {
        const mid = Math.floor((low + high) / 2);
        if (cumulative[mid] <= target) low = mid;
        else high = mid;
      }

      const p1 = coords[low];
      const p2 = coords[high];
      const segmentLength = cumulative[high] - cumulative[low];
      const subT = segmentLength ? (target - cumulative[low]) / segmentLength : 0;

      return [
        p1[0] + (p2[0] - p1[0]) * subT,
        p1[1] + (p2[1] - p1[1]) * subT
      ];
    }

    // Snap a point onto a route and return distance + progress (0..1).
    function projectPointToRoute(point, route) {
      const coords = route.coordinates;
      const cumulative = route.cumulative;
      const total = cumulative[cumulative.length - 1];
      const latScale = Math.cos(point[0] * Math.PI / 180);
      let best = { distance: Infinity, progress: 0 };

      for (let i = 0; i < coords.length - 1; i++) {
        const ax = (coords[i][1] - point[1]) * latScale;
        const ay = coords[i][0] - point[0];
        const bx = (coords[i + 1][1] - point[1]) * latScale;
        const by = coords[i + 1][0] - point[0];
        const dx = bx - ax;
        const dy = by - ay;
        const len2 = dx * dx + dy * dy;
        let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));

        const px = ax + dx * t;
        const py = ay + dy * t;
        const distance = Math.hypot(px, py) * 111320;

        if (distance < best.distance) {
          const segment = cumulative[i + 1] - cumulative[i];
          best = {
            distance,
            progress: total ? (cumulative[i] + segment * t) / total : 0
          };
        }
      }

      return best;
    }

    function routeSlice(route, startProgress, endProgress) {
      const start = Math.min(startProgress, endProgress);
      const end = Math.max(startProgress, endProgress);
      const total = route.cumulative[route.cumulative.length - 1];
      const points = [interpolatePath(route.coordinates, route.cumulative, start)];

      route.coordinates.forEach((coord, i) => {
        const progress = total ? route.cumulative[i] / total : 0;
        if (progress > start && progress < end) points.push(coord);
      });

      points.push(interpolatePath(route.coordinates, route.cumulative, end));
      if (startProgress > endProgress) points.reverse();
      return points;
    }

    // --- PLACE / CHAT PARSING ---
    function resolvePlace(text) {
      if (!text) return null;
      const query = normalizeText(text);
      let best = null;

      Object.keys(landmarks).forEach(key => {
        const place = landmarks[key];
        place.aliases.forEach(alias => {
          const needle = normalizeText(alias);
          if (!needle) return;
          if (query === needle || query.includes(needle)) {
            if (!best || needle.length > best.matchLength) {
              best = {
                key,
                label: place.name,
                lat: place.coords[0],
                lng: place.coords[1],
                matchLength: needle.length
              };
            }
          }
        });
      });

      if (!best) return null;
      delete best.matchLength;
      return best;
    }

    function parseTripQuery(raw) {
      const q = normalizeText(raw);
      let m;

      const build = (originText, destText) => ({
        originText,
        destText,
        origin: originText ? resolvePlace(originText) : null,
        destination: destText ? resolvePlace(destText) : null
      });

      m = q.match(/\bfrom\s+(.+?)\s+to\s+(.+)$/);
      if (m) return build(m[1], m[2]);

      m = q.match(/\b(?:go(?:ing)?\s+to|to)\s+(.+?)\s+from\s+(.+)$/);
      if (m) return build(m[2], m[1]);

      m = q.match(/\b(?:i(?:\s+m|\s+am)|we(?:\s+re|\s+are))\s+(?:at|in|near)\s+(.+?)(?:\s*,\s*|\s+)(?:and\s+)?(?:going\s+to|to)\s+(.+)$/);
      if (m) return build(m[1], m[2]);

      m = q.match(/\b(?:i(?:\s+m|\s+am)|we(?:\s+re|\s+are))\s+(?:at|in|near)\s+(.+)$/);
      if (m) return build(m[1], null);

      m = q.match(/^(.+?)\s+to\s+(.+)$/);
      if (m) {
        const origin = resolvePlace(m[1]);
        const destination = resolvePlace(m[2]);
        if (origin || destination) return build(m[1], m[2]);
      }

      const destination = resolvePlace(q);
      return {
        originText: null,
        destText: destination ? null : q,
        origin: null,
        destination
      };
    }

    }

    function saveGeocodeCache() {
      try {
        const entries = Object.entries(geocodeCache || {});
        if (entries.length > 80) {
          entries.sort((a, b) => (b[1].time || 0) - (a[1].time || 0));
          geocodeCache = Object.fromEntries(entries.slice(0, 80));
        }
        localStorage.setItem(GEOCODE_CACHE_STORAGE, JSON.stringify(geocodeCache));
      } catch (err) {}
    }

    function getGoogleMapsKey() {
      try {
        return (localStorage.getItem(GOOGLE_KEY_STORAGE) || '').trim();
      } catch (err) {
        return '';
      }
    }

    function setGoogleMapsKey(key) {
      try {
        if (key) localStorage.setItem(GOOGLE_KEY_STORAGE, key);
        else localStorage.removeItem(GOOGLE_KEY_STORAGE);
      } catch (err) {}
    }

    function readCachedGeocode(query) {
      const cache = loadGeocodeCache();
      const key = normalizeText(query);
      const hit = cache[key];
      if (!hit) return null;
      if (Date.now() - (hit.time || 0) > GEOCODE_CACHE_TTL) {
        delete cache[key];
        return null;
      }
      return hit.results || null;
    }

    function writeCachedGeocode(query, results) {
      const cache = loadGeocodeCache();
      cache[normalizeText(query)] = { time: Date.now(), results };
      saveGeocodeCache();
    }

    async function geocodeWithGoogle(query, key) {
      const response = await fetch('https://places.googleapis.com/v1/places:searchText', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': key,
          'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location'
        },
        body: JSON.stringify({
          textQuery: `${query}, Davao City, Philippines`,
          maxResultCount: 6,
          languageCode: 'en',
          regionCode: 'PH',
          locationBias: {
            circle: {
              center: { latitude: 7.0736, longitude: 125.6110 },
              radius: 40000
            }
          }
        })
      });
      if (!response.ok) throw new Error(`Google Places ${response.status}`);
      const data = await response.json();
      return (data.places || []).map(place => ({
        name: place.displayName && place.displayName.text ? place.displayName.text : query,
        address: place.formattedAddress || '',
        lat: place.location ? place.location.latitude : NaN,
        lng: place.location ? place.location.longitude : NaN,
        source: 'Google Maps'
      })).filter(place => Number.isFinite(place.lat) && Number.isFinite(place.lng));
    }

    async function geocodeWithNominatim(query) {
      const wait = 1100 - (Date.now() - lastNominatimRequest);
      if (wait > 0) await new Promise(resolve => setTimeout(resolve, wait));
      lastNominatimRequest = Date.now();

      const params = new URLSearchParams({
        format: 'jsonv2',
        q: /davao/i.test(query) ? query : `${query}, Davao City`,
        limit: '6',
        countrycodes: 'ph',
        viewbox: '125.20,7.36,125.78,6.90',
        bounded: '1',
        'accept-language': 'en'
      });
      const response = await fetch(`https://nominatim.openstreetmap.org/search?${params.toString()}`, {
        headers: { Accept: 'application/json' }
      });
      if (!response.ok) throw new Error(`OpenStreetMap ${response.status}`);
      const data = await response.json();
      return data.map(item => ({
        name: item.name || (item.display_name || query).split(',')[0].trim(),
        address: item.display_name || '',
        lat: parseFloat(item.lat),
        lng: parseFloat(item.lon),
        source: 'OpenStreetMap'
      })).filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));
    }

    async function geocodePlace(query) {
      const cached = readCachedGeocode(query);
      if (cached && cached.length) return cached;

      const key = getGoogleMapsKey();
      if (key) {
        try {
          const results = await geocodeWithGoogle(query, key);
          if (results.length) {
            writeCachedGeocode(query, results);
            return results;
          }
        } catch (err) {
          console.warn('Google Maps lookup failed; using OpenStreetMap.', err);
        }
      }

      try {
        const results = await geocodeWithNominatim(query);
        if (results.length) writeCachedGeocode(query, results);
        return results;
      } catch (err) {
        console.warn('OpenStreetMap lookup failed.', err);
        return [];
      }
    }

    function describeCoverage(place) {
      const stops = nearestStops(place, MAX_ACCESS_WALK);
      if (!stops.length) return { text: 'Outside the mapped route area', className: 'text-rose-300' };
      return {
        text: `Near ${landmarks[stops[0].key].name} · ${formatDistance(stops[0].distance)} walk`,
        className: 'text-emerald-300'
      };
    }

    function renderGeocodeCandidates(query, results, role, parsed) {
      const container = document.getElementById('route-list');
      container.innerHTML = '';
      const source = results[0] && results[0].source ? results[0].source : 'search';
      container.appendChild(chatBox(`I found ${results.length} match${results.length === 1 ? '' : 'es'} for <b>${escapeHtml(query)}</b> using ${escapeHtml(source)}. Pick one:`));

      results.forEach(place => {
        const coverage = describeCoverage(place);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'w-full text-left p-3 rounded-lg border border-slate-700 bg-slate-900/60 hover:border-amber-400 hover:bg-slate-800/60 transition';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="text-sm font-semibold text-slate-100">${escapeHtml(place.name)}</div>
              <div class="text-[11px] text-slate-400 mt-0.5 line-clamp-2">${escapeHtml(place.address || 'No address returned')}</div>
            </div>
            <span class="text-[9px] uppercase tracking-wide text-slate-500 shrink-0">${escapeHtml(place.source)}</span>
          </div>
          <div class="text-[10px] ${coverage.className} mt-2">${escapeHtml(coverage.text)}</div>
        `;
        card.onclick = () => selectGeocodedPlace(place, role, parsed);
        container.appendChild(card);
      });

      const link = document.createElement('a');
      link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + ' Davao City')}`;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.className = 'block text-center text-[10px] text-sky-300 hover:text-sky-200 underline pt-1';
      link.textContent = 'Open this search in Google Maps';
      container.appendChild(link);
    }

    async function offerGeocode(query, role, parsed) {
      const sequence = ++geocodeSequence;
      renderRouteList(davaoRoutes, `Looking up <b>${escapeHtml(query)}</b>…`);
      const results = await geocodePlace(query);
      if (sequence !== geocodeSequence) return;
      if (!results.length) {
        const link = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query + ' Davao City')}`;
        renderRouteList(davaoRoutes, `I couldn't find <b>${escapeHtml(query)}</b> nearby. Try a more specific name, or <a class="text-sky-300 underline" href="${link}" target="_blank" rel="noopener noreferrer">search it on Google Maps</a>.`);
        return;
      }
      renderGeocodeCandidates(query, results, role, parsed);
    }

    function selectGeocodedPlace(place, role, parsed) {
      const chosen = {
        key: null,
        label: place.name,
        lat: place.lat,
        lng: place.lng
      };

      if (role === 'origin') {
        userLocation = chosen;
        setOriginMarker(chosen);
        map.setView([chosen.lat, chosen.lng], 14);
        if (parsed.destination) {
          planTrip(chosen, parsed.destination);
        } else {
          showIdleState(`Starting point set to <b>${escapeHtml(chosen.label)}</b>. Where do you want to go?`);
        }
        return;
      }

      if (parsed.origin) {
        userLocation = parsed.origin;
        planTrip(parsed.origin, chosen);
        return;
      }

      if (parsed.originText) {
        offerGeocode(parsed.originText, 'origin', { ...parsed, destination: chosen });
        return;
      }

      locateUser(chosen);
    }

    // --- TRIP GRAPH ---
    let tripGraph = null;

    function buildTripGraph() {
      if (tripGraph) return tripGraph;

      const adjacency = {};
      const addEdge = (from, edge) => {
        if (!adjacency[from]) adjacency[from] = [];
        adjacency[from].push(edge);
      };

      const routeSets = {};
      davaoRoutes.forEach(route => {
        route.landmarks.forEach(key => {
          if (!routeSets[key]) routeSets[key] = new Set();
          routeSets[key].add(route.id);
        });
      });

      davaoRoutes.forEach(route => {
        const total = route.cumulative[route.cumulative.length - 1];
        for (let i = 0; i < route.landmarks.length - 1; i++) {
          const from = route.landmarks[i];
          const to = route.landmarks[i + 1];
          const fromInfo = route.stopInfo[from];
          const toInfo = route.stopInfo[to];
          if (!fromInfo || !toInfo) continue;

          const distance = Math.abs(toInfo.progress - fromInfo.progress) * total;

          addEdge(from, {
            type: 'ride', route, from, to,
            fromProgress: fromInfo.progress, toProgress: toInfo.progress,
            distance, cost: distance
          });
          addEdge(to, {
            type: 'ride', route, from: to, to: from,
            fromProgress: toInfo.progress, toProgress: fromInfo.progress,
            distance, cost: distance
          });
        }
      });

      const keys = Object.keys(landmarks);
      for (let i = 0; i < keys.length; i++) {
        for (let j = i + 1; j < keys.length; j++) {
          const a = keys[i];
          const b = keys[j];
          const routesA = routeSets[a] || new Set();
          const routesB = routeSets[b] || new Set();
          const sharesRoute = [...routesA].some(id => routesB.has(id));
          if (sharesRoute) continue;

          const distance = haversineDistance(landmarks[a].coords, landmarks[b].coords);
          if (distance > MAX_TRANSFER_WALK) continue;

          addEdge(a, { type: 'walk', from: a, to: b, distance, cost: distance * WALK_COST_MULTIPLIER });
          addEdge(b, { type: 'walk', from: b, to: a, distance, cost: distance * WALK_COST_MULTIPLIER });
        }
      }

      tripGraph = adjacency;
      return tripGraph;
    }

    // Dijkstra over stops. The state includes the last mode and route so the
    // planner cannot chain walking transfers and can penalise extra boardings.
    function shortestPath(adjacency, startKey, endKey) {
      if (startKey === endKey) return { edges: [], cost: 0 };

      const startState = `${startKey}|start|-`;
      const dist = { [startState]: 0 };
      const previous = {};
      const queue = [[0, startState]];

      while (queue.length) {
        queue.sort((a, b) => a[0] - b[0]);
        const [cost, state] = queue.shift();
        if (cost !== dist[state]) continue;

        const [node, mode, routeId] = state.split('|');

        if (node === endKey) {
          const edges = [];
          let cursor = state;
          while (previous[cursor]) {
            edges.push(previous[cursor].edge);
            cursor = previous[cursor].state;
          }
          return { edges: edges.reverse(), cost };
        }

        (adjacency[node] || []).forEach(edge => {
          if (edge.type === 'walk' && mode === 'walk') return;
          const nextRoute = edge.type === 'ride' ? edge.route.id : '-';
          const isNewBoarding = edge.type === 'ride' && (mode !== 'ride' || routeId !== nextRoute);
          const nextCost = cost + edge.cost + (isNewBoarding ? BOARDING_PENALTY : 0);
          const nextState = `${edge.to}|${edge.type}|${nextRoute}`;
          if (nextCost < (dist[nextState] ?? Infinity)) {
            dist[nextState] = nextCost;
            previous[nextState] = { state, edge };
            queue.push([nextCost, nextState]);
          }
        });
      }

      return null;
    }

    function nearestStops(point, maxDistance = MAX_ACCESS_WALK) {
      return Object.keys(landmarks)
        .map(key => ({
          key,
          distance: haversineDistance([point.lat, point.lng], landmarks[key].coords)
        }))
        .filter(item => item.distance <= maxDistance)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 8);
    }

    async function planTrip(origin, destination) {
      if (!destination || (!destination.key && !Number.isFinite(destination.lat))) {
        renderRouteList(davaoRoutes, `I couldn't find that destination. Try ${supportedPlacesText()}.`);
        return;
      }

      const adjacency = buildTripGraph();
      const originCandidates = origin.key ? [{ key: origin.key, distance: 0 }] : nearestStops(origin);
      const destinationCandidates = destination.key ? [{ key: destination.key, distance: 0 }] : nearestStops(destination);

      if (!originCandidates.length || !destinationCandidates.length) {
        renderRouteList(davaoRoutes, `You're outside the supported Davao route area. Try a starting point near a known landmark like ${supportedPlacesText()}.`);
        return;
      }

      let best = null;
      originCandidates.forEach(o => {
        destinationCandidates.forEach(d => {
          const path = shortestPath(adjacency, o.key, d.key);
          if (!path) return;

          const firstEdge = path.edges[0];
          const accessWalk = firstEdge && firstEdge.type === 'walk'
            ? haversineDistance([origin.lat, origin.lng], landmarks[firstEdge.to].coords)
            : o.distance;
          if (accessWalk > MAX_ACCESS_WALK) return;

          const total = path.cost + o.distance * WALK_COST_MULTIPLIER + d.distance * WALK_COST_MULTIPLIER;
          if (!best || total < best.total) {
            best = { ...path, originStop: o, destinationStop: d, total };
          }
        });
      });

      if (!best) {
        const from = origin.label || 'your location';
        const to = destination.label || 'that destination';
        renderRouteList(davaoRoutes, `I couldn't connect <b>${escapeHtml(from)}</b> to <b>${escapeHtml(to)}</b> with the current routes. Try a nearby landmark or a different destination.`);
        return;
      }

      const trip = buildTrip(best, origin, destination);
      currentTrip = trip;
      await enrichWalkPaths(trip);
      showTrip(trip);
    }

    const walkPathCache = new Map();

    async function fetchWalkPath(from, to) {
      const key = `${from.lat.toFixed(5)},${from.lng.toFixed(5)}->${to.lat.toFixed(5)},${to.lng.toFixed(5)}`;
      if (walkPathCache.has(key)) return walkPathCache.get(key);
      try {
        const url = `https://router.project-osrm.org/route/v1/foot/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        if (!res.ok) { walkPathCache.set(key, null); return null; }
        const data = await res.json();
        const coords = data && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates;
        if (!coords || !coords.length) { walkPathCache.set(key, null); return null; }
        const path = coords.map(c => [c[1], c[0]]);
        walkPathCache.set(key, path);
        return path;
      } catch (e) {
        walkPathCache.set(key, null);
        return null;
      }
    }

    async function enrichWalkPaths(trip) {
      const walkLegs = trip.legs.filter(leg => leg.type === 'walk');
      await Promise.all(walkLegs.map(async leg => {
        const path = await fetchWalkPath(leg.from, leg.to);
        if (path && path.length > 1) leg.path = path;
      }));
    }

    function buildTrip(best, origin, destination) {
      const legs = [];

      best.edges.forEach(edge => {
        if (edge.type === 'walk') {
          const from = landmarks[edge.from];
          const to = landmarks[edge.to];
          legs.push({
            type: 'walk',
            from: { lat: from.coords[0], lng: from.coords[1], label: from.name },
            to: { lat: to.coords[0], lng: to.coords[1], label: to.name },
            distance: edge.distance
          });
          return;
        }

        const last = legs[legs.length - 1];
        if (last && last.type === 'ride' && last.route.id === edge.route.id && last.toStop === edge.from) {
          last.toStop = edge.to;
          last.toProgress = edge.toProgress;
          last.distance += edge.distance;
        } else {
          legs.push({
            type: 'ride',
            route: edge.route,
            fromStop: edge.from,
            toStop: edge.to,
            fromProgress: edge.fromProgress,
            toProgress: edge.toProgress,
            distance: edge.distance
          });
        }
      });

      const originStop = landmarks[best.originStop.key];
      const destinationStop = landmarks[best.destinationStop.key];

      const addOriginWalk = () => {
        legs.unshift({
          type: 'walk',
          from: { lat: origin.lat, lng: origin.lng, label: origin.label || 'Your location' },
          to: { lat: originStop.coords[0], lng: originStop.coords[1], label: originStop.name },
          distance: best.originStop.distance
        });
      };

      const addDestinationWalk = () => {
        legs.push({
          type: 'walk',
          from: { lat: destinationStop.coords[0], lng: destinationStop.coords[1], label: destinationStop.name },
          to: { lat: destination.lat, lng: destination.lng, label: destination.label || 'Destination' },
          distance: best.destinationStop.distance
        });
      };

      if (legs.length === 0) {
        if (best.originStop.distance > 40) addOriginWalk();
        if (best.destinationStop.distance > 40) addDestinationWalk();
      } else {
        if (best.originStop.distance > 40) {
          const first = legs[0];
          if (first.type === 'walk') {
            first.from = { lat: origin.lat, lng: origin.lng, label: origin.label || 'Your location' };
            first.distance = haversineDistance([origin.lat, origin.lng], [first.to.lat, first.to.lng]);
          } else {
            addOriginWalk();
          }
        }

        if (best.destinationStop.distance > 40) {
          const last = legs[legs.length - 1];
          if (last.type === 'walk') {
            last.to = { lat: destination.lat, lng: destination.lng, label: destination.label || 'Destination' };
            last.distance = haversineDistance([last.from.lat, last.from.lng], [destination.lat, destination.lng]);
          } else {
            addDestinationWalk();
          }
        }
      }

      const rides = legs.filter(leg => leg.type === 'ride');

      return {
        origin,
        destination,
        legs,
        totalWalk: legs.filter(leg => leg.type === 'walk').reduce((sum, leg) => sum + leg.distance, 0),
        transfers: Math.max(0, rides.length - 1)
      };
    }

    // --- UI RENDER ---
    function chatBox(html) {
      const box = document.createElement('div');
      box.className = "p-3 bg-amber-500/10 border border-amber-500/30 rounded-lg text-xs text-amber-200";
      box.innerHTML = `<div class="flex gap-2"><span>🤖</span><div><b>Commute Assistant:</b><div class="mt-1 leading-relaxed">${html}</div></div></div>`;
      return box;
    }

    function createRouteCard(route, selectedIds = null) {
      const highlighted = selectedIds || (activeRoute ? [activeRoute.id] : []);
      const isSelected = highlighted.includes(route.id);
      const card = document.createElement('div');
      card.className = `p-3 rounded-lg border transition cursor-pointer ${
        isSelected
          ? 'bg-slate-700/80 border-amber-400 text-white'
          : 'bg-slate-900/60 border-slate-700 hover:border-slate-500 text-slate-300'
      }`;

      const stopNames = route.landmarks.slice(0, 4).map(key => landmarks[key] ? landmarks[key].name : key);

      card.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="font-bold text-sm flex items-center gap-2" style="color: ${route.color}">
            <span class="inline-block w-3 h-3 rounded-full" style="background-color: ${route.color}"></span>
            ${route.name}
          </span>
          <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 font-mono">${route.fare}</span>
        </div>
        <p class="text-xs text-slate-400 line-clamp-2">${route.description}</p>
        <div class="mt-2 flex flex-wrap gap-1">
          ${stopNames.map(l => `<span class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded">${l}</span>`).join('')}
        </div>
      `;

      card.onclick = () => selectRoute(route);
      return card;
    }

    function renderRouteList(routes, chatMessage = null) {
      const container = document.getElementById('route-list');
      container.innerHTML = '';

      if (chatMessage) container.appendChild(chatBox(chatMessage));
      routes.forEach(route => container.appendChild(createRouteCard(route)));
    }

    function renderTripSummary(trip) {
      const container = document.getElementById('route-list');
      container.innerHTML = '';

      const legsHtml = trip.legs.map(leg => {
        if (leg.type === 'walk') {
          return `<li class="flex gap-2"><span>🚶</span><div>Walk <b>${formatDistance(leg.distance)}</b> to <b>${escapeHtml(leg.to.label)}</b></div></li>`;
        }
        const fromName = landmarks[leg.fromStop].name;
        const toName = landmarks[leg.toStop].name;
        return `<li class="flex gap-2"><span>🚌</span><div><b style="color:${leg.route.color}">${leg.route.name}</b><br><span class="text-slate-400">${fromName} → ${toName}</span> <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 font-mono">${leg.route.fare}</span></div></li>`;
      }).join('');

      const rides = trip.legs.filter(leg => leg.type === 'ride');
      const summary = rides.length === 0
        ? 'Everything is within walking distance.'
        : `${rides.length === 1 ? 'Direct jeepney ride' : `${trip.transfers} transfer${trip.transfers > 1 ? 's' : ''}`} · ${formatDistance(trip.totalWalk)} walking`;

      const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${trip.origin.lat},${trip.origin.lng}&destination=${trip.destination.lat},${trip.destination.lng}&travelmode=walking`;
      const box = chatBox(`
        <div class="font-semibold text-emerald-300">Trip to ${escapeHtml(trip.destination.label)}</div>
        <ol class="mt-2 space-y-2">${legsHtml}</ol>
        <div class="mt-2 text-[10px] text-slate-400">${summary} · dashed walks follow roads (OSRM) when available</div>
        <div class="mt-2"><a class="text-sky-300 underline text-xs" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">Walking directions on Google Maps ↗</a></div>
        <div class="mt-2 flex items-center gap-2 text-[10px] text-slate-400">
          <span>Walk display:</span>
          <button id="walk-mode-btn" class="px-2 py-0.5 rounded bg-slate-800 text-slate-200 hover:bg-slate-700">${walkMode === 'roads' ? 'Roads' : 'Straight'}</button>
          <span class="text-slate-500">${walkMode === 'roads' ? 'OSRM road-following (may detour)' : 'straight-line connectors'}</span>
        </div>
      `);
      container.appendChild(box);

      const walkBtn = document.getElementById('walk-mode-btn');
      if (walkBtn) walkBtn.onclick = () => {
        walkMode = (walkMode === 'roads') ? 'straight' : 'roads';
        if (currentTrip) { showTrip(currentTrip); renderTripSummary(currentTrip); }
      };

      const heading = document.createElement('div');
      heading.className = 'text-[10px] uppercase tracking-wide text-slate-500 pt-1';
      heading.textContent = 'All routes';
      container.appendChild(heading);

      const tripRouteIds = [...new Set(trip.legs.filter(leg => leg.type === 'ride').map(leg => leg.route.id))];
      davaoRoutes.forEach(route => container.appendChild(createRouteCard(route, tripRouteIds)));
    }

    // --- MAP DISPLAY ---
    function initMap() {
      map = L.map('map').setView([7.0736, 125.6110], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      davaoRoutes.forEach(route => {
        route.cumulative = buildCumulativeDistances(route.coordinates);
        route.stopInfo = {};
        route.landmarks.forEach(key => {
          const place = landmarks[key];
          if (place) route.stopInfo[key] = projectPointToRoute(place.coords, route);
        });

        const polyline = L.polyline(route.coordinates, {
          color: route.color,
          weight: 5,
          opacity: 0.6,
          lineJoin: 'round',
          smoothFactor: 0
        }).addTo(map);

        polyline.bindPopup(`<b>${route.name}</b><br>${route.description}`);
        polylineLayers[route.id] = polyline;
      });

      map.on('click', e => {
        if (!awaitingMapPick) return;
        awaitingMapPick = false;
        const target = pendingDestination;
        pendingDestination = null;
        applyUserLocation(e.latlng.lat, e.latlng.lng, target);
      });

      tripLayer = L.layerGroup().addTo(map);
      selectRoute(davaoRoutes[0]);
      renderRouteList(davaoRoutes, 'Tap <b>My Location</b> and tell me where you\'re going. You can also type <b>from Matina to Abreeza</b>.');
    }

    function clearTripDisplay() {
      if (tripLayer) tripLayer.clearLayers();
      animationRange = { start: 0, end: 1 };
      animProgress = 0;
      document.getElementById('progress-bar').value = 0;
    }

    function showIdleState(message) {
      clearTripDisplay();
      activeRoute = null;
      isPlaying = false;
      cancelAnimationFrame(animFrameId);

      const btn = document.getElementById('play-btn');
      btn.innerText = '\u25b6 Play';
      btn.className = 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded text-xs font-bold transition min-w-[60px]';

      if (jeepMarker) {
        map.removeLayer(jeepMarker);
        jeepMarker = null;
      }

      Object.values(polylineLayers).forEach(layer => layer.setStyle({ opacity: 0.6, weight: 5 }));
      document.getElementById('active-route-name').innerText = 'Select a destination';
      renderRouteList(davaoRoutes, message);
    }

    function selectRoute(route) {
      clearTripDisplay();

      activeRoute = route;
      animProgress = 0;
      animationRange = { start: 0, end: 1 };

      Object.keys(polylineLayers).forEach(id => {
        if (id === route.id) {
          polylineLayers[id].setStyle({ opacity: 1.0, weight: 8 });
          polylineLayers[id].bringToFront();
        } else {
          polylineLayers[id].setStyle({ opacity: 0.3, weight: 4 });
        }
      });

      document.getElementById('active-route-name').innerText = route.name;
      document.getElementById('progress-bar').value = 0;

      setJeepMarker(route.coordinates[0], route.color);
      map.fitBounds(polylineLayers[route.id].getBounds(), { padding: [50, 50] });
      renderRouteList(davaoRoutes);
    }

    function showTrip(trip) {
      if (isPlaying) {
        isPlaying = false;
        cancelAnimationFrame(animFrameId);
        const btn = document.getElementById('play-btn');
        btn.innerText = '▶ Play';
        btn.className = 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded text-xs font-bold transition min-w-[60px]';
      }

      if (tripLayer) tripLayer.clearLayers();
      Object.values(polylineLayers).forEach(layer => layer.setStyle({ opacity: 0.15, weight: 4 }));

      const boundsPoints = [];

      trip.legs.forEach(leg => {
        let coords;
        if (leg.type === 'ride') {
          coords = routeSlice(leg.route, leg.fromProgress, leg.toProgress);
          L.polyline(coords, {
            color: leg.route.color, weight: 8, opacity: 1, lineJoin: 'round'
          }).addTo(tripLayer);
        } else {
          coords = (walkMode === 'roads' && leg.path && leg.path.length > 1) ? leg.path : [[leg.from.lat, leg.from.lng], [leg.to.lat, leg.to.lng]];
          L.polyline(coords, {
            color: '#94a3b8', weight: 4, opacity: 0.9, dashArray: '6 8'
          }).addTo(tripLayer);
        }
        boundsPoints.push(...coords);
      });

      const destinationIcon = L.divIcon({
        html: '<div style="background:#ef4444;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:14px">🏁</div>',
        className: '',
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
      L.marker([trip.destination.lat, trip.destination.lng], { icon: destinationIcon })
        .addTo(tripLayer)
        .bindTooltip(trip.destination.label);

      const rides = trip.legs.filter(leg => leg.type === 'ride');
      rides.slice(0, -1).forEach(leg => {
        const stop = landmarks[leg.toStop];
        L.circleMarker(stop.coords, {
          radius: 7, color: '#f59e0b', weight: 3, fillColor: '#0f172a', fillOpacity: 1
        }).addTo(tripLayer).bindTooltip(`Transfer at ${stop.name}`);
      });

      setOriginMarker(trip.origin);

      const bounds = L.latLngBounds(
        boundsPoints.concat([[trip.origin.lat, trip.origin.lng], [trip.destination.lat, trip.destination.lng]])
      );
      map.fitBounds(bounds, { padding: [50, 50] });

      if (rides.length > 0) {
        const first = rides[0];
        activeRoute = first.route;
        animationRange = { start: first.fromProgress, end: first.toProgress };
        animProgress = 0;
        const startPoint = interpolatePath(activeRoute.coordinates, activeRoute.cumulative, first.fromProgress);
        setJeepMarker(startPoint, activeRoute.color);
        document.getElementById('progress-bar').value = 0;
      } else {
        activeRoute = null;
        animationRange = { start: 0, end: 0 };
      }

      document.getElementById('active-route-name').innerText = `Trip to ${trip.destination.label}`;
      renderTripSummary(trip);
    }

    // --- ANIMATION ---
    function animate() {
      if (!isPlaying || !activeRoute) return;

      animProgress += animSpeed;
      if (animProgress >= 1) animProgress = 0;

      document.getElementById('progress-bar').value = animProgress * 100;

      const pathProgress = animationRange.start + (animationRange.end - animationRange.start) * animProgress;
      const currentPoint = interpolatePath(activeRoute.coordinates, activeRoute.cumulative, pathProgress);
      jeepMarker.setLatLng(currentPoint);

      if (document.getElementById('follow-cam').checked) {
        map.panTo(currentPoint, { animate: false });
      }

      animFrameId = requestAnimationFrame(animate);
    }

    // --- LOCATION ---
    function restoreLocateButton() {
      const btn = document.getElementById('locate-btn');
      btn.disabled = false;
      btn.classList.remove('opacity-60');
      btn.innerHTML = '📍 My Location';
    }

    // Firefox on Linux relies on GeoClue; when it is missing, calling the
    // Geolocation API can freeze the whole browser with no way for page JS to
    // cancel it. Detect that platform and let the user pick their spot on the
    // map instead (accurate, and no native call).
    function isLinuxFirefox() {
      const ua = navigator.userAgent || '';
      return /Firefox\//.test(ua) && /Linux/.test(ua);
    }

    function applyUserLocation(lat, lng, destination) {
      userLocation = { lat, lng, label: 'My Location' };
      setOriginMarker(userLocation);
      map.setView([lat, lng], 14);
      restoreLocateButton();
      if (destination) {
        planTrip(userLocation, destination);
      } else {
        showIdleState('Location set. Where do you want to go?');
      }
    }

    function promptMapPick(destination) {
      awaitingMapPick = true;
      pendingDestination = destination;
      const btn = document.getElementById('locate-btn');
      btn.disabled = true;
      btn.classList.add('opacity-60');
      btn.textContent = '🖱️ Tap your spot on the map';
      renderRouteList(davaoRoutes, 'Firefox on Linux can\'t read GPS here (it can freeze the browser). <b>Tap your location on the map</b>, or type a starting point like <b>from Flores to Abreeza</b>.');
    }

    function locateUser(destination = null) {
      if (!navigator.geolocation) {
        renderRouteList(davaoRoutes, 'Geolocation is not available in this browser. Type your starting point instead, e.g. <b>from Matina to Abreeza</b>.');
        return;
      }

      if (isLinuxFirefox()) {
        promptMapPick(destination);
        return;
      }

      const attempt = ++locateAttempt;
      pendingDestination = destination;
      const btn = document.getElementById('locate-btn');
      btn.disabled = true;
      btn.classList.add('opacity-60');
      btn.textContent = '⏳ Locating…';

      const guard = setTimeout(() => {
        if (attempt !== locateAttempt) return;
        locateAttempt++;
        pendingDestination = null;
        restoreLocateButton();
        renderRouteList(davaoRoutes, 'Location is taking too long. Your browser may be waiting on its location service. Type your starting point instead, e.g. <b>from Bankerohan to Toril</b>.');
      }, 9000);

      navigator.geolocation.getCurrentPosition(
        position => {
          if (attempt !== locateAttempt) return;
          clearTimeout(guard);
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            label: 'My Location'
          };
          setOriginMarker(userLocation);
          map.setView([userLocation.lat, userLocation.lng], 14);
          restoreLocateButton();

          const target = pendingDestination;
          pendingDestination = null;
          if (target) {
            planTrip(userLocation, target);
          } else {
            showIdleState('Location set. Where do you want to go?');
          }
        },
        () => {
          if (attempt !== locateAttempt) return;
          clearTimeout(guard);
          pendingDestination = null;
          restoreLocateButton();
          renderRouteList(davaoRoutes, 'I couldn\'t get your GPS location. Allow location access, or type your starting point, e.g. <b>from Matina to Abreeza</b>.');
        },
        { enableHighAccuracy: false, timeout: 7000, maximumAge: 300000 }
      );
    }

    // --- CHAT SEARCH ---
    async function handleSearch(raw) {
      const query = raw.trim();
      if (!query) return;
      geocodeSequence++;

      const parsed = parseTripQuery(query);

      if (parsed.destination && parsed.origin && parsed.origin.key === parsed.destination.key) {
        renderRouteList(davaoRoutes, `You're already at <b>${escapeHtml(parsed.destination.label)}</b>. Enter a different destination.`);
        return;
      }

      if (parsed.destText && !parsed.destination) {
        await offerGeocode(parsed.destText, 'destination', parsed);
        return;
      }

      if (parsed.originText && !parsed.origin) {
        await offerGeocode(parsed.originText, 'origin', parsed);
        return;
      }

      if (!parsed.destination && parsed.origin) {
        userLocation = parsed.origin;
        setOriginMarker(parsed.origin);
        showIdleState(`Starting point set to <b>${escapeHtml(parsed.origin.label)}</b>. Where do you want to go?`);
        return;
      }

      if (!parsed.destination) {
        renderRouteList(davaoRoutes, `Tell me where you want to go. Try <b>Abreeza</b>, or <b>from Matina to Abreeza</b>.`);
        return;
      }

      if (parsed.origin) {
        userLocation = parsed.origin;
        planTrip(parsed.origin, parsed.destination);
        return;
      }

      if (parsed.originText) {
        renderRouteList(davaoRoutes, `I don't know where <b>${escapeHtml(parsed.originText)}</b> is. Tap <b>My Location</b> or use a known landmark like ${supportedPlacesText()}.`);
        return;
      }

      if (userLocation) {
        planTrip(userLocation, parsed.destination);
        return;
      }

      renderRouteList(davaoRoutes, 'Getting your location…');
      locateUser(parsed.destination);
    }

    // --- EVENT LISTENERS ---
    document.getElementById('play-btn').onclick = () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      if (isPlaying && activeRoute) {
        btn.innerText = '\u23f8 Pause';
        btn.className = 'bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded text-xs font-bold transition min-w-[60px]';
        animate();
      } else {
        isPlaying = false;
        btn.innerText = '\u25b6 Play';
        btn.className = 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded text-xs font-bold transition min-w-[60px]';
        cancelAnimationFrame(animFrameId);
      }
    };

    document.getElementById('progress-bar').oninput = (e) => {
      animProgress = e.target.value / 100;
      if (activeRoute && jeepMarker) {
        const pathProgress = animationRange.start + (animationRange.end - animationRange.start) * animProgress;
        const point = interpolatePath(activeRoute.coordinates, activeRoute.cumulative, pathProgress);
        jeepMarker.setLatLng(point);
      }
    };

    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.onclick = () => {
        const speedMultiplier = parseFloat(btn.dataset.speed);
        animSpeed = 0.0008 * speedMultiplier;
        document.getElementById('anim-speed-label').innerText = `Speed: ${speedMultiplier}x`;
      };
    });

    const gmapsKeyInput = document.getElementById('gmaps-key');
    const gmapsKeyStatus = document.getElementById('gmaps-key-status');
    if (gmapsKeyInput) {
      gmapsKeyInput.value = getGoogleMapsKey();
      if (getGoogleMapsKey() && gmapsKeyStatus) {
        gmapsKeyStatus.textContent = 'Google Places lookups enabled. Key stored only in this browser.';
      }
      document.getElementById('save-gmaps-key').onclick = () => {
        const key = gmapsKeyInput.value.trim();
        setGoogleMapsKey(key);
        geocodeCache = {};
        try { localStorage.removeItem(GEOCODE_CACHE_STORAGE); } catch (err) {}
        if (gmapsKeyStatus) {
          gmapsKeyStatus.textContent = key
            ? 'Google Places lookups enabled. Key stored only in this browser.'
            : 'Using OpenStreetMap lookups. No key stored.';
        }
      };
    }

    document.getElementById('search-btn').onclick = () => {
      handleSearch(document.getElementById('chat-input').value);
    };

    document.getElementById('chat-input').onkeypress = (e) => {
      if (e.key === 'Enter') handleSearch(e.target.value);
    };

    document.querySelectorAll('.preset-tag').forEach(tag => {
      tag.onclick = () => {
        const q = tag.dataset.query;
        document.getElementById('chat-input').value = q;
        handleSearch(q);
      };
    });

    document.getElementById('locate-btn').onclick = () => locateUser();

    // --- START APP ---
    window.onload = initMap;
  </script>
</body>
</html>
